name: PR Review

on:
  pull_request:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.6"
          cache: "pip"

      - run: pip install ruff bandit 

      - name: Get changed Python files
        id: changed
        run: |
          echo "files=$(git diff --name-only origin/main...HEAD -- '*.py' | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Ruff
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            ruff check ${{ steps.changed.outputs.files }}
          else
            echo "No Python files changed."
          fi

      - name: Bandit
        run: |
          if [ -n "${{ steps.changed.outputs.files }}" ]; then
            bandit ${{ steps.changed.outputs.files }}
          else
            echo "No Python files changed."
          fi