name: PR Review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ruff bandit

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Bandit
        run: |
          bandit -r .